name: Inspect FluidMotion reference

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "FluidMotion.apk"
      - ".github/workflows/inspect-fluidmotion.yml"

permissions:
  contents: write

concurrency:
  group: fluidmotion-inspection
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download JADX
        run: |
          curl -fL --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
      - name: Decompile reference for analysis
        run: /tmp/jadx/bin/jadx --no-res -d /tmp/fluid-src FluidMotion.apk
      - name: Produce a technical hook inventory (no decompiled source is committed)
        run: |
          mkdir -p docs/reference-analysis
          {
            echo "# FluidMotion hook inventory"
            echo
            echo "Generated from the repository reference APK by JADX. This report records identifiers and configuration keys only; decompiled source is not redistributed."
            echo
            echo "## Hook registration sites"
            grep -RInE 'findAndHook(Method|Constructor)|hookAllMethods|hookMethod' /tmp/fluid-src/sources 2>/dev/null | sed -E 's#^/tmp/fluid-src/sources/##' | sed -E 's/:[0-9]+:/ : /' | head -n 250 || true
            echo
            echo "## Target class constants"
            grep -RInE '(COMPOSE|CONTROLLER|CELL_LAYOUT)[[:space:]]*=' /tmp/fluid-src/sources/dev/flexy/fluidmotion 2>/dev/null | sed -E 's#^/tmp/fluid-src/sources/##' | head -n 120 || true
            echo
            echo "## Reflected classes, methods and fields"
            grep -RInE 'Class\.forName|getDeclaredMethod|getMethod\(|getDeclaredField|getField\(|getDeclaredMethods|findClass|hookMethod|setDuration|setInterpolator' /tmp/fluid-src/sources/dev/flexy/fluidmotion 2>/dev/null | sed -E 's#^/tmp/fluid-src/sources/##' | head -n 300 || true
            echo
            echo "## Method-selection predicates"
            grep -RInE 'getName\\(|getParameterCount|getParameterTypes|getReturnType|isSynthetic|isBridge|Modifier|startsWith|endsWith|contains\\(' /tmp/fluid-src/sources/dev/flexy/fluidmotion/Refl.java /tmp/fluid-src/sources/dev/flexy/fluidmotion/UnlockFlyIn.java /tmp/fluid-src/sources/dev/flexy/fluidmotion/ShadeFlyIn.java 2>/dev/null | sed -E 's#^/tmp/fluid-src/sources/##' | head -n 220 || true
            echo
            echo "## Animation and preference identifiers"
            grep -RhoE '"[A-Za-z0-9_.-]*(unlock|shade|notification|quick|spring|duration|scale|fade|stagger|anchor|bounce|app)[A-Za-z0-9_.-]*"' /tmp/fluid-src/sources 2>/dev/null | sort -u | head -n 300 || true
            echo
            echo "## Manifest summary"
            if [ -f /tmp/fluid-src/resources/AndroidManifest.xml ]; then
              grep -E 'activity|service|receiver|provider|meta-data|package=' /tmp/fluid-src/resources/AndroidManifest.xml | head -n 160 || true
            fi
          } > docs/reference-analysis/FLUIDMOTION-HOOK-INVENTORY.md
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference-analysis/FLUIDMOTION-HOOK-INVENTORY.md
          if git diff --cached --quiet; then
            echo "No inventory changes."
          else
            git commit -m "Add generated FluidMotion hook inventory"
            git fetch origin main
            git rebase origin/main
            git push
          fi
